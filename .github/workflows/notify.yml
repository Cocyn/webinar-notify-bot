name: Webinar notify bot

on:
  schedule:
    # Каждые 5 минут, круглосуточно — для публичного репозитория минуты
    # GitHub Actions бесплатны и не лимитированы, так что ограничивать
    # часы/дни недели не обязательно (но при желании можно, см. README).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # кнопка "Run workflow" в вкладке Actions — для ручной проверки

# На случай если два запуска всё же пересекутся по времени — не даём им
# работать параллельно (хотя теперь это не критично: бот ничего не
# коммитит, конфликтовать нечему).
concurrency:
  group: webinar-notify-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notify bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CRED_JSON: ${{ secrets.CRED_JSON }}
          # id сообщения, которое бот всегда редактирует (не создаёт новое).
          # Задаётся как переменная репозитория — Settings → Secrets and
          # variables → Actions → вкладка Variables → New repository
          # variable → MESSAGE_ID.
          MESSAGE_ID: ${{ vars.MESSAGE_ID }}
          SCHEDULE_YEAR: "2026"
        run: python3 notify_bot.py
