name: Webinar notify bot

on:
  schedule:
    # Каждые 5 минут, но со сдвигом на 2 минуты (2,7,12...) — GitHub сам
    # предупреждает, что ровные отметки (0,5,10...) перегружены и чаще
    # опаздывают/пропускаются. Сдвиг снижает риск многочасовых задержек.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}   # кнопка "Run workflow" в вкладке Actions — для ручной проверки

# На случай если два запуска всё же пересекутся по времени — не даём им
# работать параллельно (хотя теперь это не критично: бот ничего не
# коммитит, конфликтовать нечему).
concurrency:
  group: webinar-notify-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notify bot
        id: notify
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CRED_JSON: ${{ secrets.CRED_JSON }}
          MESSAGE_ID: ${{ vars.MESSAGE_ID }}
          TEXT_HASH: ${{ vars.TEXT_HASH }}
          SCHEDULE_YEAR: "2026"
          PIN_MESSAGE: "false"
        run: python3 notify_bot.py

      # Запускается, только если статус реально изменился (см. notify_bot.py).
      # Обновляет переменные репозитория через gh CLI — нужен PAT-секрет
      # ACTIONS_PAT, т.к. встроенный GITHUB_TOKEN не может менять переменные.
      - name: Save new MESSAGE_ID / TEXT_HASH
        if: steps.notify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          gh variable set MESSAGE_ID --body "${{ steps.notify.outputs.message_id }}" --repo "${{ github.repository }}"
          gh variable set TEXT_HASH --body "${{ steps.notify.outputs.text_hash }}" --repo "${{ github.repository }}"
